# Generated from theme.toml: do not edit by hand,
# change a setting and run the generator again.
# hyprlock exits without this file, so the lock key would do nothing.

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
}

# The wallpaper, blurred; the theme background when no wallpaper is set.
background {
    monitor =
    path = 
    color = rgba(1d162cff)
    blur_passes = 2
    blur_size = 8
}

label {
    monitor =
    text = $TIME
    color = rgba(e6e2eeff)
    font_size = 96
    font_family = Monocraft
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    color = rgba(d8d1e5ff)
    font_size = 20
    font_family = Monocraft
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = 12
    dots_size = 0.2
    outer_color = rgba(5fd0c0ff)
    inner_color = rgba(171122d9)
    font_color = rgba(e6e2eeff)
    font_family = Monocraft
    check_color = rgba(83d5c9ff)
    fail_color = rgba(67bec8ff)
    capslock_color = rgba(83d5c9ff)
    placeholder_text = Password
    fail_text = $FAIL ($ATTEMPTS)
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
