# Idle: dim, lock, screen off, then suspend (hypridle, started with the
# compositor: Hyprland, Sway or Niri).
# Generated from config.json (idle.*, in minutes, 0 = never): change them
# there or in the Settings window (SUPER + H), not here. "Stay awake" in the
# system panel (SUPER + B) blocks all of it: hypridle respects Wayland idle
# inhibitors (ignore_wayland_inhibit = false, the default).

general {
    lock_cmd = qs ipc -c desktop call lock lock || pidof hyprlock || hyprlock  # the shell's, else hyprlock
    before_sleep_cmd = loginctl lock-session                                 # locked before suspend
    after_sleep_cmd = [ -n "$NIRI_SOCKET" ] || { [ -n "$SWAYSOCK" ] && swaymsg "output * power on"; } || hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # screen on at wake-up
}

listener {
    timeout = 300  # 5 min: dim the screen
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 600  # 10 min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660  # 11 min: screen off
    on-timeout = if [ -n "$NIRI_SOCKET" ]; then niri msg action power-off-monitors; elif [ -n "$SWAYSOCK" ]; then swaymsg "output * power off"; else hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'; fi
    on-resume = [ -n "$NIRI_SOCKET" ] || { [ -n "$SWAYSOCK" ] && swaymsg "output * power on"; } || hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

listener {
    timeout = 1800  # 30 min: suspend
    on-timeout = systemctl suspend
}
