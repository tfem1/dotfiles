# Targets manifest: each entry turns a template into a generated file, at the
# standard location of the app it is for.
#
# Required keys: template (relative to templates/), output.
# Optional keys:
#   needs   = required binary; the target is skipped when it is missing
#   reload  = command run when the generated file changed
#   include = line added (between markers) to the app's own config so that
#             it loads the generated file: { into, line, comment = "#",
#             position = "end" | "start", create = false }
#   needs_dir = folder set up by another command; skipped until it exists
# Placeholders: {config} = $XDG_CONFIG_HOME (or ~/.config),
#               {data}   = $XDG_DATA_HOME (or ~/.local/share),
#               {sddm}   = the login screen's folder (/var/lib/tfem/sddm),
#               {shell}  = shell name, set in config.json (shell.name).

[hyprland]
template = "hypr/theme.lua.tpl"
output   = "{config}/hypr/theme.lua"
needs    = "Hyprland"
reload   = "hyprctl reload"
# create = false: never create an empty hyprland.lua in place of yours.
include  = { into = "{config}/hypr/hyprland.lua", line = 'require("theme")', comment = "--" }

# Sway and Niri, when picked in the installer instead of Hyprland: colors,
# gaps, borders, corners and font of their windows.
[sway]
template = "sway/theme.conf.tpl"
output   = "{config}/sway/theme.conf"
needs    = "sway"
reload   = "swaymsg reload"

[niri]
template = "niri/theme.kdl.tpl"
output   = "{config}/niri/theme.kdl"
needs    = "niri"
# Niri reloads its config by itself when an included file changes.

[hyprland-shell]
template = "hypr/shell.lua.tpl"
output   = "{config}/hypr/shell.lua"
needs    = "Hyprland"
reload   = "hyprctl reload"
# Loaded by hyprland.lua (require("shell")): no include needed.

# Modes picked in Settings → Display (config.json display.modes); loaded by
# config/monitors.lua. Hyprland applies them when it reloads.
[hyprland-display]
template = "hypr/display.lua.tpl"
output   = "{config}/hypr/display.lua"
needs    = "Hyprland"
reload   = "hyprctl reload"

[quickshell]
template = "quickshell/theme.json.tpl"
output   = "{config}/quickshell/{shell}/theme.json"
needs    = "qs"
# No reload: the shell watches this file and updates itself.

# Idle steps from config.json (idle.*). hypridle reads its config when it
# starts: it is started again (detached, so the generator does not wait).
[hypridle]
template = "hypr/hypridle.conf.tpl"
output   = "{config}/hypr/hypridle.conf"
needs    = "hypridle"
reload   = "pkill -x hypridle; setsid -f hypridle >/dev/null 2>&1; true"

# The login screen (SDDM, set up by `tfem sddm install`): its colors and a
# copy of the wallpaper, in a folder SDDM can read. The installed theme reads
# this file as its theme.conf.user: the login screen follows the theme, no
# sudo needed after the install.
[sddm]
template  = "sddm/theme.conf.tpl"
output    = "{sddm}/theme.conf"
needs_dir = "{sddm}"
reload    = "{{ sddm.copy }}"

[hyprlock]
template = "hypr/hyprlock.conf.tpl"
output   = "{config}/hypr/hyprlock.conf"
needs    = "hyprlock"
# No reload: hyprlock reads its config each time it starts.

[kitty]
template = "kitty/theme.conf.tpl"
output   = "{config}/kitty/theme.conf"
needs    = "kitty"
# Open windows take the new colors at once: kitty reloads its config on
# SIGUSR1 (recent versions also reload by themselves when a file changes).
reload   = "pkill -USR1 -x kitty || true"
# At the end of kitty.conf so the theme wins; move the block up to let your
# own colors win (the generator keeps it where it is). create = true: a new
# kitty.conf holding only this line is fine.
include  = { into = "{config}/kitty/kitty.conf", line = "include theme.conf", comment = "#", create = true }

# GTK 3 and GTK 4 apps. Colors go in theme.css, loaded by one @import line
# that must come first in gtk.css (CSS comments need the closing "*/").
[gtk3]
template = "gtk/gtk3.css.tpl"
output   = "{config}/gtk-3.0/theme.css"
include  = { into = "{config}/gtk-3.0/gtk.css", line = '@import url("theme.css");', comment = "/*", comment_end = "*/", position = "start", create = true }

[gtk4]
template = "gtk/gtk4.css.tpl"
output   = "{config}/gtk-4.0/theme.css"
needs    = "gsettings"
include  = { into = "{config}/gtk-4.0/gtk.css", line = '@import url("theme.css");', comment = "/*", comment_end = "*/", position = "start", create = true }
# The settings GTK apps read on any desktop: theme (adw-gtk3 reads the
# colors), dark or light style, icons, cursor, fonts. Open apps follow at once.
reload   = "gsettings set org.gnome.desktop.interface gtk-theme {{ gtk.theme | quote }} && gsettings set org.gnome.desktop.interface color-scheme {{ gtk.color_scheme | quote }} && gsettings set org.gnome.desktop.interface icon-theme {{ icons.name | quote }} && gsettings set org.gnome.desktop.interface cursor-theme {{ cursor.theme | quote }} && gsettings set org.gnome.desktop.interface cursor-size {{ cursor.size }} && gsettings set org.gnome.desktop.interface font-name {{ gtk.font | quote }} && gsettings set org.gnome.desktop.interface monospace-font-name {{ gtk.mono_font | quote }}"

# Qt 5 and Qt 6 apps, through qt5ct and qt6ct (QT_QPA_PLATFORMTHEME=qt5ct is
# set in hypr/config/variables.lua; qt6ct answers to that name too). Qt apps
# read their palette when they start.
[qt5ct-colors]
template = "qt/colors.conf.tpl"
output   = "{config}/qt5ct/colors/theme.conf"
needs    = "qt5ct"

[qt5ct]
template = "qt/qt5ct.conf.tpl"
output   = "{config}/qt5ct/qt5ct.conf"
needs    = "qt5ct"

[qt6ct-colors]
template = "qt/colors.conf.tpl"
output   = "{config}/qt6ct/colors/theme.conf"
needs    = "qt6ct"

[qt6ct]
template = "qt/qt6ct.conf.tpl"
output   = "{config}/qt6ct/qt6ct.conf"
needs    = "qt6ct"

# Folder color of the FairyWren icons. The file records it; the reload points
# the icons' folder link at that color (until the icons are downloaded there
# is nothing to change: `tfem icons fetch` reads this file then). The paths
# are given in full, so a test sandbox never touches your own icons.
[icons]
template = "icons/folders.tpl"
output   = "{data}/tfem/icon-folders"
reload   = "python3 {{ dirs.root | quote }}/scripts/icons.py folders {{ icons.folders | quote }} --icons {{ dirs.data | quote }}/icons"
