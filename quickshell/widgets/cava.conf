# cava for the audio spectrum widget: 24 bars, values 0 to 100, one frame
# per line ("0;12;100;...;"). The input is left to cava: PipeWire, else
# PulseAudio. Sleeps after 3 s of silence.
[general]
bars = 24
framerate = 30
sleep_timer = 3

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
