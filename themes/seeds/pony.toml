# Seeds of the pony themes. Every color is a canon color of the character,
# taken from the My Little Pony Friendship is Magic Wiki (mlp.fandom.com) on
# 2026-11-07. Build the theme files with:
#   PYTHONPATH=scripts python3 -m theming.builder themes/seeds/pony.toml
#
# tint   = color the backgrounds are made from
# text   = color the text is made from
# accent = the theme's signature color
# accent3 = a second canon color, used sparingly (now playing, CPU)
# slots  = canon colors placed on the hue slot they belong to
#          (red, orange, yellow, green, cyan, blue, purple, pink)
# The builder keeps each hue and adjusts lightness until it is readable.

prefix = "pony"
family = "Pony"
credit = "Colors of My Little Pony: Friendship is Magic characters (Hasbro), from the MLP wiki"

[themes.twilight]                 # Twilight Sparkle: lavender coat, navy and magenta mane
name    = "Twilight"
variant = "dark"
tint    = "#273873"
text    = "#D19FE4"
accent  = "#D19FE4"
accent3 = "#ED438D"            # magenta mane stripe, used sparingly
slots   = { purple = "#D19FE4", pink = "#ED438D", blue = "#779BCB" }

[themes.pinkie]                   # Pinkie Pie: pink coat, hot pink mane, blue eyes
name    = "Pinkie"
variant = "dark"
tint    = "#BA1E7D"
text    = "#FAB3D1"
accent  = "#F7438C"
accent3 = "#76D2FB"            # blue eyes, used sparingly
slots   = { pink = "#F7438C", cyan = "#76D2FB", yellow = "#FCEFA4" }

[themes.rarity]                   # Rarity: white coat, purple mane, blue eyes
