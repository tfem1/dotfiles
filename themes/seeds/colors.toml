# Seeds of the color themes: one theme for each color of the wheel, dark,
# and a few light ones. Original colors, no other theme copied. Build the
# theme files with:
#   PYTHONPATH=scripts python3 -m theming.builder themes/seeds/colors.toml
# Keys: tint (backgrounds), text, accent and slots (hue slot -> color). The
# builder keeps each hue and adjusts lightness until it is readable.

prefix = "color"
family = "Colors"
credit = "Original colors, one per hue"

[themes.ruby]                     # deep red
name    = "Ruby"
variant = "dark"
tint    = "#4A1520"
text    = "#F3DADD"
accent  = "#F0566E"
slots   = { red = "#F0566E" }

