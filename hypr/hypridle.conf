# Idle: dim, lock, screen off, then suspend (hypridle, started with Hyprland).
# Based on the example of the Hyprland wiki (hypridle page). "Stay awake" in
# the system panel (SUPER + B) blocks all of it: hypridle respects Wayland
# idle inhibitors (ignore_wayland_inhibit = false, the default).

general {
    lock_cmd = pidof hyprlock || hyprlock                                    # one lock screen only
    before_sleep_cmd = loginctl lock-session                                 # locked before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # screen on at wake-up
}

listener {
    timeout = 300                         # 5 min: dim the screen
    on-timeout = brightnessctl -s set 10  # low, not 0 (OLED screens)
    on-resume = brightnessctl -r          # back to the previous brightness
}

listener {
    timeout = 600                         # 10 min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660                         # 11 min: screen off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

listener {
    timeout = 1800                        # 30 min: suspend
    on-timeout = systemctl suspend
}
