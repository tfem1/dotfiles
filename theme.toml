# theme.toml — the look of the desktop: the single source of truth.
#
# This file holds the defaults. Your personal copy lives in
# ~/.config/tfem/theme.toml: only the keys you write there replace these.
# Never edit a generated file: change a setting here (or in the Settings
# window), then run `tfem generate`.
#
# Rule of thumb: appearance lives here, everything else (bar, widgets,
# displays, identity) lives in config.json.

schema = 1                      # format version, for clean migrations

[palette]
source = "pony-twilight"        # a theme from themes/ or ~/.config/tfem/themes/, or "wallpaper"
accent = "theme"                # theme (its own signature color) | red | orange | yellow | green
                                # | cyan | blue | purple | brown
mode   = "dark"                 # dark | light: used when the palette comes from the wallpaper

[palette.overrides]             # replace one base16 slot of the chosen theme, e.g.:
# base00 = "#11111b"

[wallpaper]
path = ""                       # empty = none; relative to ~/Pictures/Wallpapers, or absolute
follow = true                   # a pony wallpaper of the collection brings the pony's
                                # theme (Luna wallpaper, Luna theme); other images
                                # keep the current theme

[font]
sans      = "Inter"
mono      = "JetBrainsMono Nerd Font"
size      = 11                  # pt, shell text
mono_size = 11                  # pt, terminals

[shape]
radius   = 12                   # px, corners of windows and shell surfaces
border   = 0                    # px, window border (0 = none)
gaps_in  = 4                    # px, between windows
gaps_out = 6                    # px, between windows and screen edges

[effects]
opacity     = 0.9               # opacity of shell surfaces (0.5 to 1.0)
blur        = true
blur_size   = 8
blur_passes = 2
shadow      = false
animations  = true

[cursor]
theme = "Adwaita"
size  = 24

[icons]
theme   = "FairyWren"           # FairyWren: dark or light from the palette (downloaded by
                                # `tfem icons fetch`); or any installed icon theme's name
folders = "theme"               # FairyWren folder color: theme (closest to the accent) or
                                # blue, cyan, green, indigo, magenta, pink, pine, red, teal,
                                # violet, yellow, grey, ... (FairyWren_Dark/places/colours)

[modules]                       # color of each shell module: the theme's own three
                                # colors (accent, accent2, accent3), so it stays
                                # minimal, or any hue (red, orange, yellow, green,
                                # cyan, blue, purple, brown) for more color
workspaces    = "accent"
clock         = "accent"        # clock and calendar
notifications = "accent"        # urgent notifications always stay red
battery       = "accent2"       # the status icons share one color
wifi          = "accent2"
network       = "accent2"
bluetooth     = "accent2"
audio         = "accent2"       # bar module, volume panel and OSD
brightness    = "accent2"       # brightness OSD
media         = "accent3"       # now playing: the one touch of the third color
resources     = "accent3"       # CPU and RAM
