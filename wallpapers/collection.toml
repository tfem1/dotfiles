# Wallpapers from wallhaven.cc, downloaded on your machine by
# `tfem wallpapers fetch` into ~/Pictures/Wallpapers/<category>/.
#
# The images are not stored in this repository: they remain the property of
# their authors (wallhaven.cc). Page of each wallpaper: https://wallhaven.cc/w/<id>
# Picked on 2026-11-11, pixel art only: forests, and cats. SFW, at least
# 1920x1080, landscape, every image looked at; left out: maps, games
# screenshots, characters from brands, portrait images.
#
# theme = the theme that goes with the picture (themes/<theme>.toml): picking
# the wallpaper switches to it. Day forests: Moss; night and mist: Pine;
# snow: Nord; cats: Tabby.

