# Wallpapers from wallhaven.cc, downloaded on your machine by
# `tfem wallpapers fetch` into ~/Pictures/Wallpapers/<category>/.
#
# The images are not stored in this repository: they remain the property of
# their authors (wallhaven.cc), and My Little Pony belongs to Hasbro.
# Picked on 2026-11-07: SFW only, at most 10 MB each, every image checked by
# eye. My Little Pony only since 2026-11-08 (the forests were removed). Page of
# each wallpaper: https://wallhaven.cc/w/<id>
# Left out on purpose: humanized characters, square or very narrow images,
# parodies about drugs, shipping drawings, photos without ponies.
# Every pony wallpaper was checked again on 2026-11-07 through its wallhaven
# tags (two were removed: a drug parody and a humanized pony).
#
# character = the pony shown alone, when it has a theme (themes/pony-<name>):
# picking that wallpaper switches to the character's theme. Group pictures and
# ponies without a theme have none and keep the current theme.

